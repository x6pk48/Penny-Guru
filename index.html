<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny the Peanut — your recording buddy</title>
<style>
:root {
  --bg:#fbf3e6; --card:#fffaf1; --ink:#3b2412; --muted:#7d6550; --line:#ecd9bd;
  --accent:#e8873a; --accent-lo:#b9631f; --good:#3f9b6b; --good-lo:#2c7650;
  --warn:#d9a21c; --bad:#c9573f; --wave:#e8873a;
  --shell:#d29a58; --shell-hi:#e8bd84; --shell-lo:#a8733a; --out:#4a2a10;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1c140d; --card:#271b11; --ink:#f6e8d3; --muted:#b39b82; --line:#3d2b1b;
    --accent:#f29a4d; --accent-lo:#b9631f; --good:#5cc48f; --good-lo:#2f8a5f;
    --warn:#f0bf45; --bad:#ec7b64; --wave:#f29a4d;
  }
}
:root[data-theme="dark"] {
  --bg:#1c140d; --card:#271b11; --ink:#f6e8d3; --muted:#b39b82; --line:#3d2b1b;
  --accent:#f29a4d; --accent-lo:#b9631f; --good:#5cc48f; --good-lo:#2f8a5f;
  --warn:#f0bf45; --bad:#ec7b64; --wave:#f29a4d;
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); }
body { font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif; line-height:1.5; min-height:100vh; }
.app { max-width:520px; margin:0 auto; padding:18px 18px 48px; }

.top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.top h1 { font-size:1.05rem; margin:0; font-weight:800; }
.chips { display:flex; gap:8px; }
.chip { background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:4px 12px; font-weight:800; font-size:.85rem; }
.chip b { font-variant-numeric:tabular-nums; }

.stage { position:relative; margin:14px 0 0; display:flex; flex-direction:column; align-items:center; }
.glow { position:absolute; top:6px; width:250px; height:250px; border-radius:50%; background:radial-gradient(circle,rgba(232,135,58,.28),transparent 68%); transition:transform .4s; }
.stage.listening .glow { animation:breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform:scale(1.18); } }
#penny { position:relative; width:230px; height:250px; overflow:visible; }
#penny .all { transform-origin:100px 210px; animation:bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-5px) rotate(-1deg); } }
.eyes { transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite; }
@keyframes blink { 0%,94%,100% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
.mouth { display:none; }
.m-idle .mouth.smile, .m-rec .mouth.smile, .m-send .mouth.flat { display:inline; }
.m-happy .mouth.open, .m-wow .mouth.open { display:inline; }
.m-sad .mouth.sad { display:inline; }
.armL,.armR { transform-box:fill-box; transform-origin:50% 10%; transition:transform .3s; }
.m-rec .armL { animation:wave 1s ease-in-out infinite alternate; }
.m-rec .armR { animation:wave 1s ease-in-out infinite alternate-reverse; }
.m-happy .armL,.m-wow .armL { transform:rotate(55deg); } .m-happy .armR,.m-wow .armR { transform:rotate(-55deg); }
.m-sad .armL { transform:rotate(-12deg); } .m-sad .armR { transform:rotate(12deg); }
@keyframes wave { from { transform:rotate(-12deg); } to { transform:rotate(22deg); } }
#penny .all.m-wow { animation:hop .55s ease-out 3; }
@keyframes hop { 40% { transform:translateY(-26px) rotate(3deg); } }
#penny .all.m-sad { animation:none; transform:translateY(4px) rotate(2deg); }
.m-sad .brow { display:inline; } .brow { display:none; }
.sweat { display:none; } .m-send .sweat { display:inline; }
#penny .armL,#penny .armR { display:none; }
#penny .all.m-happy .armL,#penny .all.m-happy .armR,#penny .all.m-wow .armL,#penny .all.m-wow .armR,#penny .all.m-sad .armL,#penny .all.m-sad .armR { display:inline; }
#penny .all.m-happy .gh,#penny .all.m-wow .gh { display:none; }
.guitar { transform-origin:100px 172px; }
.m-rec .guitar { animation:sway 1.2s ease-in-out infinite alternate; }
@keyframes sway { from { transform:rotate(30deg); } to { transform:rotate(35deg); } }
.m-rec .strum { animation:strum .35s ease-in-out infinite alternate; }
@keyframes strum { from { transform:translate(0,-6px); } to { transform:translate(0,8px); } }
.tune { display:none; font-size:22px; fill:var(--accent); font-weight:800; }
.m-rec .tune { display:inline; animation:rise 1.8s ease-out infinite; }
.m-rec .tune.t2 { animation-delay:.9s; }
@keyframes rise { from { opacity:1; transform:translateY(10px); } to { opacity:0; transform:translateY(-32px); } }
.name { font-weight:800; font-size:1.2rem; margin-top:2px; }
.role { color:var(--muted); font-size:.85rem; }

.bubble { position:relative; background:var(--card); border:2px solid var(--line); border-radius:20px; padding:14px 18px; margin:20px 0 14px; min-height:74px; font-size:1.05rem; font-weight:700; text-align:center; }
.bubble::before { content:""; position:absolute; top:-11px; left:50%; width:18px; height:18px; background:var(--card); border-left:2px solid var(--line); border-top:2px solid var(--line); transform:translateX(-50%) rotate(45deg); }
.bubble em { font-style:normal; color:var(--accent-lo); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bubble em { color:var(--accent); } }
.bubble.bump { animation:bump .3s ease-out; }
@keyframes bump { 50% { transform:scale(1.03); } }

.panel { background:var(--card); border:2px solid var(--line); border-radius:22px; padding:18px; }
.steps { display:flex; gap:6px; margin-bottom:14px; }
.step { flex:1; text-align:center; font-size:.8rem; font-weight:800; padding:6px 0; border-radius:10px; background:var(--bg); color:var(--muted); border:1.5px solid var(--line); }
.step.on { background:var(--accent); color:#fff; border-color:var(--accent-lo); }
.step.done { background:var(--good); color:#fff; border-color:var(--good-lo); }
.status { display:flex; align-items:center; gap:10px; font-weight:800; margin-bottom:10px; }
.dot { width:12px; height:12px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.dot.rec { background:var(--bad); animation:pulse 1s infinite; } .dot.ok { background:var(--good); } .dot.warn { background:var(--warn); }
@keyframes pulse { 50% { opacity:.3; } }
.timer { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted); }
.wave { display:flex; align-items:center; justify-content:center; gap:3px; height:64px; background:var(--bg); border-radius:14px; padding:0 10px; margin-bottom:12px; overflow:hidden; }
.wave i { flex:1; max-width:7px; height:6px; border-radius:4px; background:var(--wave); opacity:.45; transition:height .12s; }
.wave.live i { opacity:1; }
.track { position:relative; height:14px; background:var(--bg); border-radius:8px; border:1.5px solid var(--line); overflow:hidden; }
.track > div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--warn)); border-radius:8px; transition:width .25s linear; }
.track.full > div { background:var(--good); }
.goal { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); font-weight:700; margin:5px 2px 14px; }

.row { display:flex; gap:10px; }
button { font:inherit; font-weight:800; border-radius:14px; border:0; padding:14px 18px; cursor:pointer; transition:transform .08s, box-shadow .08s; min-height:48px; }
button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
button:active:not(:disabled) { transform:translateY(3px); box-shadow:none !important; }
.primary { flex:2; background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accent-lo); }
.primary.go { background:var(--good); box-shadow:0 4px 0 var(--good-lo); }
.second { flex:1; background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); }
.second[hidden] { display:none; }
.note { color:var(--muted); font-size:.78rem; text-align:center; margin:14px 0 0; }

.pop { position:fixed; font-weight:900; font-size:1.3rem; color:var(--accent-lo); pointer-events:none; animation:float 1.1s ease-out forwards; z-index:9; }
@keyframes float { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-90px); } }
.bit { position:fixed; width:9px; height:9px; border-radius:2px; pointer-events:none; z-index:8; animation:fall 1.6s ease-out forwards; }
@keyframes fall { to { transform:translate(var(--dx),70vh) rotate(540deg); opacity:0; } }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Record your answer</h1>
    <div class="chips"><span class="chip">🔥 <b id="streak">0</b></span><span class="chip">⚡ <b id="xp">0</b> XP</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <svg id="penny" viewBox="0 0 200 220" role="img" aria-label="Penny the Peanut, a friendly cartoon peanut">
      <ellipse cx="100" cy="212" rx="58" ry="7" fill="#000" opacity=".12"/>
      <g class="all m-idle" id="pennyMood">
        <g class="armL"><ellipse cx="38" cy="120" rx="10" ry="20" fill="var(--shell)" stroke="var(--out)" stroke-width="4" transform="rotate(14 38 120)"/></g>
        <g class="armR"><ellipse cx="162" cy="120" rx="10" ry="20" fill="var(--shell)" stroke="var(--out)" stroke-width="4" transform="rotate(-14 162 120)"/></g>
        <ellipse cx="78" cy="204" rx="17" ry="9" fill="var(--shell-lo)" stroke="var(--out)" stroke-width="4"/>
        <ellipse cx="122" cy="204" rx="17" ry="9" fill="var(--shell-lo)" stroke="var(--out)" stroke-width="4"/>
        <path d="M100 14C142 14 158 44 150 72C146 88 136 96 138 104C162 120 166 156 150 182C136 206 64 206 50 182C34 156 38 120 62 104C64 96 54 88 50 72C42 44 58 14 100 14Z" fill="var(--shell)" stroke="var(--out)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M66 36C78 22 96 20 108 22" fill="none" stroke="var(--shell-hi)" stroke-width="6" stroke-linecap="round"/>
        <path d="M62 128C54 144 54 160 62 174" fill="none" stroke="var(--shell-hi)" stroke-width="6" stroke-linecap="round"/>
        <g fill="var(--shell-lo)" opacity=".75"><circle cx="86" cy="138" r="3"/><circle cx="108" cy="146" r="3"/><circle cx="126" cy="132" r="3"/><circle cx="96" cy="164" r="3"/><circle cx="120" cy="170" r="3"/><circle cx="78" cy="156" r="3"/><circle cx="72" cy="40" r="2.5"/><circle cx="130" cy="42" r="2.5"/></g>
        <g class="eyes"><circle cx="82" cy="64" r="11" fill="#fff" stroke="var(--out)" stroke-width="3"/><circle cx="118" cy="64" r="11" fill="#fff" stroke="var(--out)" stroke-width="3"/><circle cx="84" cy="66" r="5.5" fill="var(--out)"/><circle cx="116" cy="66" r="5.5" fill="var(--out)"/><circle cx="86" cy="63" r="2" fill="#fff"/><circle cx="118" cy="63" r="2" fill="#fff"/></g>
        <g class="brow" stroke="var(--out)" stroke-width="4" stroke-linecap="round"><path d="M70 46L92 52"/><path d="M130 46L108 52"/></g>
        <ellipse cx="66" cy="86" rx="8" ry="5" fill="#f08a7a" opacity=".6"/><ellipse cx="134" cy="86" rx="8" ry="5" fill="#f08a7a" opacity=".6"/>
        <g class="sweat" fill="#7ec3f0"><path d="M140 46C144 54 146 58 142 62C138 62 136 56 140 46Z"/></g>
        <path class="mouth smile" d="M86 88Q100 102 114 88" fill="none" stroke="var(--out)" stroke-width="4" stroke-linecap="round"/>
        <path class="mouth open" d="M84 86Q100 112 116 86Z" fill="var(--out)" stroke="var(--out)" stroke-width="3" stroke-linejoin="round"/>
        <path class="mouth sad" d="M88 98Q100 86 112 98" fill="none" stroke="var(--out)" stroke-width="4" stroke-linecap="round"/>
        <path class="mouth flat" d="M90 92H110" fill="none" stroke="var(--out)" stroke-width="4" stroke-linecap="round"/>
        <g class="guitar" transform="rotate(32 100 172)">
          <rect x="94" y="76" width="12" height="14" rx="3" fill="#5a3416" stroke="var(--out)" stroke-width="3"/>
          <rect x="96" y="88" width="8" height="64" fill="#7a4a22" stroke="var(--out)" stroke-width="3"/>
          <g fill="#f3d9a6"><circle cx="92" cy="80" r="2.2"/><circle cx="92" cy="86" r="2.2"/><circle cx="108" cy="80" r="2.2"/><circle cx="108" cy="86" r="2.2"/></g>
          <g fill="var(--out)" stroke="var(--out)" stroke-width="9" stroke-linejoin="round"><ellipse cx="100" cy="180" rx="32" ry="27"/><ellipse cx="100" cy="152" rx="24" ry="19"/></g>
          <g fill="#c4622f"><ellipse cx="100" cy="180" rx="32" ry="27"/><ellipse cx="100" cy="152" rx="24" ry="19"/></g>
          <path d="M80 170C80 160 90 156 100 156" fill="none" stroke="#e08a55" stroke-width="4" stroke-linecap="round"/>
          <circle cx="100" cy="168" r="9" fill="var(--out)"/>
          <rect x="90" y="190" width="20" height="4" rx="2" fill="#5a3416"/>
          <g stroke="#f3e6cc" stroke-width="1"><line x1="98" y1="84" x2="98" y2="192"/><line x1="102" y1="84" x2="102" y2="192"/></g>
          <g class="gh"><g class="strum"><ellipse cx="100" cy="172" rx="10" ry="7" fill="var(--shell)" stroke="var(--out)" stroke-width="3.5"/></g>
          <ellipse cx="100" cy="118" rx="8" ry="7" fill="var(--shell)" stroke="var(--out)" stroke-width="3.5"/></g>
        </g>
        <text class="tune" x="168" y="40">♪</text><text class="tune t2" x="22" y="58">♫</text>
      </g>
    </svg>
    <div class="name">Penny the Peanut</div>
    <div class="role">your recording buddy, guitar in hand</div>
  </div>

  <div class="bubble" id="bubble" aria-live="polite"><span id="msg"></span></div>

  <div class="panel">
    <div class="steps" id="steps"><div class="step">Record</div><div class="step">Review</div><div class="step">Send</div></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Ready when you are</span><span class="timer" id="timer">0:00</span></div>
    <div class="wave" id="wave"></div>
    <div class="track" id="track"><div id="fill"></div></div>
    <div class="goal"><span>Aim for 10 seconds</span><span id="goalTxt">Just start — any take counts</span></div>
    <div class="row">
      <button class="second" id="btn2" hidden></button>
      <button class="primary" id="btn1"></button>
    </div>
    <p class="note">Practice mode — no microphone is used and nothing is uploaded.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const S = { xp:0, streak:0, sent:0, secs:0, state:'idle', timer:null, wavet:null, tries:0, nudged:false, pending:false };
const GOAL = 10, MIN = 5;
const mood = $('pennyMood'), stage = $('stage');

for (let i=0;i<30;i++) $('wave').appendChild(document.createElement('i'));
const bars = [...document.querySelectorAll('#wave i')];

const lines = {
  idle: ["Hi, I’m Penny! Press <em>Start recording</em> and I’ll strum along right beside you. 🎸", "Take a breath. There’s no wrong way to do this — <em>just start</em>.", "Ready when you are. Every take earns XP, even the messy ones."],
  nudge: ["You’re doing great — <em>just a few more seconds</em>. Keep going!", "Don’t stop now! You’ve already done the hardest part: starting.", "So close! Give me <em>a little more</em> — I’m listening."],
  review: ["That’s a wrap! You really did it. <em>Send it</em> when you’re ready.", "Nice take! Send it off, or retake — I’m proud either way.", "Look at you, finishing a whole recording! Now <em>send it</em>."],
  send: ["Sending… hold tight, you’re almost done!", "Packing it up with extra care… 🥜"],
  done: ["It’s in! <em>Submission accepted</em> — you pushed through. 🎉", "Accepted! That took guts. Streak up! 🔥"],
  fail: ["That upload didn’t go through — <em>not your fault</em>. Your take is safe, try again!", "Hiccup! Nothing’s lost. Tap <em>Try sending again</em> — you’re one tap away."],
  tooshort: ["That was a quick one — <em>want another go</em>? I’ll cheer you on."]
};
const during = [
  [0, "I’m strumming softly while you talk. <em>Take your time</em> — you’ve got this! 🎸"],
  [2, "Great start! Keep your voice steady and natural. 🎙️"],
  [5, "Halfway there — <em>you’re doing wonderfully</em>!"],
  [8, "Almost at the finish line! Wrap up your thought. ✨"],
  [10, "That’s a full take! Stop whenever you like — <em>you smashed it</em>."]
];
const pick = a => a[Math.floor(Math.random()*a.length)];

function say(html) {
  $('msg').innerHTML = html;
  const b = $('bubble'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
}
function setMood(m) { mood.setAttribute('class','all m-'+m); stage.classList.toggle('listening', m==='rec'); }
function fmt(s) { return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function setSteps(n) {
  [...$('steps').children].forEach((el,i) => el.className = 'step' + (i<n?' done':i===n?' on':''));
}
function addXP(n, btn) {
  S.xp += n; $('xp').textContent = S.xp;
  const r = btn.getBoundingClientRect(), p = document.createElement('div');
  p.className='pop'; p.textContent='+'+n+' XP'; p.style.left=(r.left+r.width/2-30)+'px'; p.style.top=r.top+'px';
  document.body.appendChild(p); setTimeout(()=>p.remove(),1200);
}
function confetti() {
  const cols=['#e8873a','#d9a21c','#3f9b6b','#c9573f','#7a5cd6'];
  for (let i=0;i<26;i++) {
    const c=document.createElement('div'); c.className='bit';
    c.style.background=cols[i%cols.length]; c.style.left=(innerWidth/2)+'px'; c.style.top='170px';
    c.style.setProperty('--dx',((Math.random()-.5)*Math.min(innerWidth,480))+'px');
    c.style.animationDelay=(Math.random()*.2)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),2000);
  }
}
function live(on) {
  $('wave').classList.toggle('live', on);
  clearInterval(S.wavet);
  if (on) S.wavet = setInterval(()=>bars.forEach(b=>b.style.height=(8+Math.random()*52)+'px'),140);
  else bars.forEach(b=>b.style.height='6px');
}
function ui(o) {
  $('dot').className = 'dot ' + (o.dot||'');
  $('status').textContent = o.status;
  $('btn1').textContent = o.b1; $('btn1').className = 'primary' + (o.go?' go':'');
  const b2 = $('btn2'); b2.hidden = !o.b2; if (o.b2) b2.textContent = o.b2;
  setSteps(o.step);
}

function toIdle() {
  S.state='idle'; S.secs=0; S.nudged=false; $('timer').textContent='0:00'; $('fill').style.width='0'; $('track').classList.remove('full');
  $('goalTxt').textContent='Just start — any take counts';
  live(false); setMood('idle');
  ui({status:'Ready when you are', b1:'● Start recording', step:0});
}
function startRec() {
  S.state='recording'; S.secs=0; S.nudged=false;
  setMood('rec'); live(true);
  ui({dot:'rec', status:'Recording…', b1:'■ Stop', step:0});
  say(during[0][1]);
  clearInterval(S.timer);
  S.timer = setInterval(() => {
    S.secs++;
    $('timer').textContent = fmt(S.secs);
    $('fill').style.width = Math.min(100, S.secs/GOAL*100)+'%';
    $('goalTxt').textContent = S.secs>=GOAL ? 'Goal reached! 🎉' : (GOAL-S.secs)+'s to go';
    if (S.secs>=GOAL) $('track').classList.add('full');
    const m = during.find(d => d[0]===S.secs);
    if (m && S.state!=='nudge') say(m[1]);
  }, 1000);
}
function stopRec() {
  if (S.secs < MIN && !S.nudged) {
    S.nudged = true; S.state='nudge';
    say(pick(lines.nudge));
    ui({dot:'rec', status:'Still recording…', b1:'Keep going', b2:'Stop anyway', step:0});
    return;
  }
  clearInterval(S.timer); live(false);
  if (S.secs < 2) { toIdle(); say(pick(lines.tooshort)); return; }
  S.state='review';
  setMood('happy'); setTimeout(()=>{ if(S.state==='review') setMood('idle'); }, 1400);
  addXP(10, $('btn1'));
  ui({dot:'ok', status:'Take saved — '+fmt(S.secs), b1:'↑ Send recording', go:true, b2:'Retake', step:1});
  say(pick(lines.review));
}
function send() {
  S.state='sending'; setMood('send');
  ui({dot:'warn', status:'Sending…', b1:'Sending…', step:2});
  $('btn1').disabled = true; $('btn2').hidden = true;
  say(pick(lines.send));
  const ok = S.tries === 0 ? true : Math.random() > 0.35;
  S.tries++;
  setTimeout(() => {
    $('btn1').disabled = false;
    if (ok) {
      S.state='done'; S.sent++; S.streak++;
      $('streak').textContent = S.streak;
      setMood('wow'); setTimeout(()=>{ if(S.state==='done') setMood('idle'); }, 1800);
      addXP(25, $('btn1')); confetti();
      ui({dot:'ok', status:'Submission accepted', b1:'Record another', step:3});
      say(pick(lines.done));
    } else {
      S.state='failed'; S.streak=0; $('streak').textContent=0;
      setMood('sad');
      ui({dot:'warn', status:'Upload failed — your take is safe', b1:'↻ Try sending again', go:true, b2:'Retake', step:1});
      say(pick(lines.fail));
    }
  }, 1500);
}

$('btn1').addEventListener('click', () => {
  if (S.state==='idle') startRec();
  else if (S.state==='recording') stopRec();
  else if (S.state==='nudge') { S.state='recording'; ui({dot:'rec', status:'Recording…', b1:'■ Stop', step:0}); say("That’s the spirit! <em>Keep going</em> — I’m right here. 💛"); }
  else if (S.state==='review' || S.state==='failed') send();
  else if (S.state==='done') { toIdle(); say(pick(lines.idle)); }
});
$('btn2').addEventListener('click', () => {
  if (S.state==='nudge') { S.nudged = true; stopRec(); }
  else if (S.state==='review' || S.state==='failed') { toIdle(); startRec(); }
});

toIdle(); say(pick(lines.idle));
</script>
